databases:
  - name: gesgym-db-frankfurt
    plan: free
    region: frankfurt
    databaseName: gesgym
    user: gesgym

  # Base de production definitive, sur le compte Render de Royal Gym.
  - name: royal-gym-db
    plan: free
    region: frankfurt
    databaseName: royalgym
    user: royalgym

services:
  - type: web
    name: gesgym-web
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python -m gunicorn smartclub.wsgi:application -c gunicorn_conf.py --bind 0.0.0.0:$PORT --log-file - --access-logfile -
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gesgym-db-frankfurt
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: "smartclubpro.org,www.smartclubpro.org,.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://smartclubpro.org,https://www.smartclubpro.org,https://*.onrender.com"
      - key: DJANGO_CANONICAL_HOST
        value: smartclubpro.org
      # Racine des liens partages a l'exterieur (lien de preinscription,
      # adresses inserees dans les e-mails). Sans elle, ces liens reprendraient
      # l'adresse par laquelle le personnel consulte l'application.
      - key: DJANGO_PUBLIC_BASE_URL
        value: https://smartclubpro.org
      - key: DJANGO_USE_X_FORWARDED_HOST
        value: "True"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "True"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "True"
      - key: DJANGO_SERVE_MEDIA
        value: "False"
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_ENDPOINT_URL
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_MEDIA_LOCATION
        value: media
      - key: B2_CUSTOM_DOMAIN
        sync: false
      - key: B2_QUERYSTRING_AUTH
        value: "True"
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: DJANGO_EMAIL_HOST
        value: mail.smartclubpro.org
      - key: DJANGO_EMAIL_PORT
        value: "465"
      - key: DJANGO_EMAIL_HOST_USER
        value: noreply@smartclubpro.org
      - key: DJANGO_EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_EMAIL_USE_TLS
        value: "False"
      - key: DJANGO_EMAIL_USE_SSL
        value: "True"
      - key: DJANGO_DEFAULT_FROM_EMAIL
        value: noreply@smartclubpro.org
      - key: DJANGO_SERVER_EMAIL
        value: noreply@smartclubpro.org

  # Site de production definitif de Royal Gym (compte Render royalgym243@gmail.com).
  # Nom technique herite du service de test initial ("gesgym-web-test") ; peut
  # etre renomme plus tard dans le dashboard Render sans casser l'URL existante.
  - type: web
    name: gesgym-web-test
    runtime: python
    plan: free
    region: frankfurt
    branch: royal-gym-rebrand
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python -m gunicorn smartclub.wsgi:application -c gunicorn_conf.py --bind 0.0.0.0:$PORT --log-file - --access-logfile -
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: royal-gym-db
          property: connectionString
      # Domaine personnalise du client (DNS en cours de propagation cote
      # client) : on garde .onrender.com dans la liste pour ne pas se
      # couper l'acces pendant la transition. CANONICAL_HOST reste vide
      # tant que le domaine n'est pas verifie, pour eviter une redirection
      # vers un domaine pas encore resolu.
      - key: DJANGO_ALLOWED_HOSTS
        value: "royalgym-fitness.com,www.royalgym-fitness.com,.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://royalgym-fitness.com,https://www.royalgym-fitness.com,https://*.onrender.com"
      - key: DJANGO_CANONICAL_HOST
        value: ""
      # Racine des liens partages a l'exterieur (preinscription, e-mails).
      # Domaine du client desormais resolu : renseignee avec
      # https://royalgym-fitness.com.
      - key: DJANGO_PUBLIC_BASE_URL
        value: "https://royalgym-fitness.com"
      - key: DJANGO_USE_X_FORWARDED_HOST
        value: "True"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "True"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SERVE_MEDIA
        value: "False"
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_ENDPOINT_URL
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_MEDIA_LOCATION
        value: media
      - key: B2_QUERYSTRING_AUTH
        value: "False"
      # Brevo via API HTTP (port 443) : le port SMTP sortant (465/587) est
      # bloque sur ce plan Render (echec identique constate avec
      # mail.smartclubpro.org et smtp-relay.brevo.com), d'ou le passage par
      # l'API Brevo (django-anymail) plutot que par le protocole SMTP.
      - key: DJANGO_EMAIL_BACKEND
        value: anymail.backends.brevo.EmailBackend
      - key: BREVO_API_KEY
        sync: false
      - key: DJANGO_DEFAULT_FROM_EMAIL
        value: contact@royalgym-fitness.com
      - key: DJANGO_SERVER_EMAIL
        value: contact@royalgym-fitness.com
